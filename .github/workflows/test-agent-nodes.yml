name: Test Agent Nodes Package

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'ryven-editor/ryven/example_nodes/agent_nodes/**'
      - 'tests/agent_nodes/**'
      - 'pytest.ini'
  pull_request:
    branches:
      - '*'
    paths:
      - 'ryven-editor/ryven/example_nodes/agent_nodes/**'
      - 'tests/agent_nodes/**'
      - 'pytest.ini'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install ryvencore
        run: python -m pip install git+https://github.com/leon-thomm/ryvencore.git@dev

      - name: Install ryvencore-qt dependencies
        run: python -m pip install . --user
        working-directory: ./ryvencore-qt

      - name: Install Ryven dependencies
        run: python -m pip install . --user
        working-directory: ./ryven-editor

      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-cov --user
          python -m pip install openai anthropic --user

      - name: Run tests
        run: python -m pytest tests/agent_nodes/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/agent_nodes/ --cov=ryven-editor/ryven/example_nodes/agent_nodes --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
